<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTF Tool DB — CTFツール辞典</title>
  <meta name="description" content="CTF(Capture The Flag)で使うツールをカテゴリ別にまとめた辞典。各ツールの使いどころをAIが解説します。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-mark">&gt;_</span>
        <div class="brand-text">
          <h1>CTF Tool DB</h1>
          <p>Capture The Flag ツール辞典 — 使いどころをAIが解説</p>
        </div>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/>
        </svg>
        <input type="search" id="search" placeholder="ツール名・用途・タグで検索（例: rsa, ステガノ, 検出）" autocomplete="off" aria-label="ツール検索">
      </div>
    </div>
  </header>

  <nav class="filters">
    <div class="container">
      <div class="tabs" id="category-tabs" role="tablist"></div>
    </div>
  </nav>

  <main class="container">
    <div class="meta-bar">
      <span id="result-count" class="result-count"></span>
      <span class="legend" id="difficulty-legend">
        難易度: <b class="d1">●</b>入門 <b class="d2">●●</b>中級 <b class="d3">●●●</b>上級
      </span>
    </div>

    <section id="tool-grid" class="tool-grid" aria-live="polite"></section>

    <div id="empty-state" class="empty-state" hidden>
      <p>該当するツールが見つかりませんでした。</p>
      <button type="button" id="reset-btn" class="ghost-btn">条件をリセット</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>CTF Tool DB — 教育・学習目的のリファレンスです。ツールは必ず許可された環境でのみ使用してください。</p>
    </div>
  </footer>

  <template id="card-template">
    <article class="card" tabindex="0">
      <div class="card-top">
        <h2 class="tool-name"></h2>
        <span class="cat-badge"></span>
      </div>
      <div class="difficulty" title=""></div>
      <p class="tagline"></p>

      <div class="section when-to-use">
        <span class="section-label">使いどころ</span>
        <p class="when-text"></p>
      </div>

      <ul class="use-cases"></ul>

      <div class="command-block">
        <span class="cmd-label">例</span>
        <code class="command"></code>
        <button type="button" class="copy-btn" title="コピー">⧉</button>
      </div>

      <button type="button" class="ai-btn">
        <span class="ai-icon">✦</span> AIにこのツールを解説してもらう
      </button>
      <div class="ai-output" hidden></div>

      <div class="sources"></div>
    </article>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
