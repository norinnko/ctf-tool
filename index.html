<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTF Tool DB — CTFツール早見表</title>
  <meta name="description" content="CTF(Capture The Flag)でよく使うツールの早見表。分野と難易度で絞り込めて、使いどころとコマンド例をまとめています。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="side">
      <header class="brand">
        <h1>CTF Tool DB</h1>
        <p>CTF でよく使うツールの早見表</p>
      </header>

      <label class="search">
        <span class="search-label">検索</span>
        <input type="search" id="search" placeholder="rsa、ステガノ、sqli …" autocomplete="off" aria-label="ツール検索">
      </label>

      <nav class="index" aria-label="分野">
        <p class="side-head">分野</p>
        <div class="tabs" id="category-tabs" role="tablist"></div>
      </nav>

      <div class="side-note" id="difficulty-legend">
        <p class="side-head">難易度</p>
        <p><span class="lv lv1">入門</span> まず触ってみる</p>
        <p><span class="lv lv2">中級</span> オプションを理解して使う</p>
        <p><span class="lv lv3">上級</span> 仕組みの知識が要る</p>
      </div>
    </aside>

    <main class="main">
      <div class="meta-bar">
        <span id="result-count" class="result-count"></span>
      </div>

      <section id="tool-grid" class="tool-grid" aria-live="polite"></section>

      <div id="empty-state" class="empty-state" hidden>
        <p>該当するツールが見つかりませんでした。</p>
        <button type="button" id="reset-btn" class="ghost-btn">条件をリセット</button>
      </div>

      <footer class="site-footer">
        <p>学習用のリファレンスです。ツールは自分の環境か、許可された環境でのみ使ってください。</p>
        <p>作成: <a href="https://norinko.jp/" target="_blank" rel="noopener">藤井 則行</a></p>
      </footer>
    </main>
  </div>

  <template id="card-template">
    <article class="card" tabindex="0">
      <div class="card-top">
        <h2 class="tool-name"></h2>
        <span class="cat-badge"></span>
        <span class="difficulty" title=""></span>
      </div>
      <p class="tagline"></p>

      <dl class="section when-to-use">
        <dt class="section-label">使いどころ</dt>
        <dd class="when-text"></dd>
      </dl>

      <ul class="use-cases"></ul>

      <div class="command-block">
        <code class="command"></code>
        <button type="button" class="copy-btn" title="コピー">コピー</button>
      </div>

      <div class="card-foot">
        <button type="button" class="ai-btn">AI の解説を読む</button>
        <div class="sources"></div>
      </div>
      <div class="ai-output" hidden></div>
    </article>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
